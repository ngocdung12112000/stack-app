<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StackShop – F01 Auth Flow (animated)</title>
<style>
  :root{
    --bg:#0f1420; --panel:#171e2e; --panel2:#1e2740; --text:#e6ebf5; --muted:#8c99b5; --line:#3a4768;
    --ok:#3ecf8e; --err:#ff6b6b; --warn:#f5b84b; --accent:#6ea8ff; --self:#b48cff;
    --c-client:#6ea8ff; --c-gw:#f5b84b; --c-id:#3ecf8e; --c-db:#ff8f5a; --c-redis:#ff6b6b; --c-mail:#b48cff;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f4f6fb; --panel:#ffffff; --panel2:#eef1f8; --text:#1b2336; --muted:#5d6985; --line:#b9c3da; }
  }
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.5 system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
  header{padding:18px 24px 6px}
  h1{margin:0;font-size:20px}
  header p{margin:4px 0 0;color:var(--muted)}
  .tabs{display:flex;flex-wrap:wrap;gap:8px;padding:12px 24px}
  .tab{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:6px 12px;border-radius:999px;cursor:pointer;font-size:13px}
  .tab.active{background:var(--accent);color:#06101f;border-color:var(--accent);font-weight:600}
  .layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;padding:0 24px 24px}
  @media (max-width:1000px){.layout{grid-template-columns:1fr}}
  .stage{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:78vh}
  svg{display:block;width:100%;min-width:760px}
  .side{display:flex;flex-direction:column;gap:12px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
  .card h3{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  #stepTitle{font-size:16px;font-weight:600;margin-bottom:6px}
  #stepDetail{color:var(--text)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .chip{font:12px ui-monospace,Consolas,monospace;background:var(--panel2);border:1px solid var(--line);padding:2px 8px;border-radius:6px}
  .controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  button{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:6px 12px;border-radius:8px;cursor:pointer;font-size:13px}
  button.primary{background:var(--accent);color:#06101f;border-color:var(--accent);font-weight:600}
  button:disabled{opacity:.4;cursor:default}
  select{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:5px}
  ol#list{margin:0;padding:0;list-style:none;max-height:280px;overflow:auto}
  ol#list li{padding:5px 8px;border-radius:6px;cursor:pointer;font-size:12.5px;color:var(--muted);display:flex;gap:8px}
  ol#list li b{min-width:20px;color:var(--muted)}
  ol#list li.done{color:var(--text)}
  ol#list li.cur{background:var(--panel2);color:var(--text);outline:1px solid var(--accent)}
  .legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted)}
  .legend i{display:inline-block;width:18px;height:0;border-top:2px solid;vertical-align:middle;margin-right:4px}
  /* svg */
  .actor-box{rx:8}
  text{font-family:system-ui,Segoe UI,sans-serif}
  .life{stroke:var(--line);stroke-dasharray:4 5;stroke-width:1.2}
  .step{opacity:0;transition:opacity .25s}
  .step.shown{opacity:.55}
  .step.cur{opacity:1}
  .arrow{fill:none;stroke-width:2;stroke-dasharray:1;stroke-dashoffset:1}
  .step.shown .arrow{stroke-dashoffset:0}
  .step.cur .arrow{transition:stroke-dashoffset var(--dur,.7s) ease-out}
  .lbl{font-size:12px;fill:var(--text)}
  .sub{font-size:10.5px;fill:var(--muted)}
  .noteBox{fill:var(--panel2);stroke:var(--self);stroke-width:1.2}
  .badge{font:700 10px system-ui;fill:#06101f}
</style>
</head>
<body>
<header>
  <h1>StackShop · F01 Identity &amp; Auth — request flow</h1>
  <p>Pick a flow, press <b>Play</b>. Each arrow is one message. Red arrows are failures. Click any step in the list to jump to it.</p>
</header>
<div class="tabs" id="tabs"></div>
<div class="layout">
  <div class="stage"><svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg></div>
  <div class="side">
    <div class="card">
      <h3>Controls</h3>
      <div class="controls">
        <button class="primary" id="play">▶ Play</button>
        <button id="prev">◀ Prev</button>
        <button id="next">Next ▶</button>
        <button id="restart">⟲ Restart</button>
        <label>Speed <select id="speed"><option value="1.6">Slow</option><option value="1" selected>Normal</option><option value="0.5">Fast</option></select></label>
      </div>
    </div>
    <div class="card">
      <h3 id="stepNo">Step</h3>
      <div id="stepTitle"></div>
      <div id="stepDetail"></div>
      <div class="chips" id="chips"></div>
    </div>
    <div class="card"><h3>Steps</h3><ol id="list"></ol></div>
    <div class="card legend">
      <span><i style="border-color:var(--ok)"></i>request / success</span>
      <span><i style="border-color:var(--err)"></i>failure</span>
      <span><i style="border-color:var(--muted);border-top-style:dashed"></i>response</span>
      <span><i style="border-color:var(--self)"></i>work inside one part</span>
    </div>
  </div>
</div>

<script>
const ACTORS = [
  {id:'client', name:'Browser / Next.js',  sub:'BFF (frontend, planned)', color:'var(--c-client)'},
  {id:'gw',     name:'Gateway (YARP)',     sub:':5000',                  color:'var(--c-gw)'},
  {id:'id',     name:'Identity service',   sub:'.NET 8',                 color:'var(--c-id)'},
  {id:'db',     name:'MySQL',              sub:'schema: identity',       color:'var(--c-db)'},
  {id:'redis',  name:'Redis',              sub:'counters, jti list',     color:'var(--c-redis)'},
  {id:'mail',   name:'Mailpit',            sub:'SMTP :1025',             color:'var(--c-mail)'},
];

// k: m = request, r = response (dashed), e = error response, s = self step (work inside one part)
const FLOWS = {
 register: { title:'Register', steps:[
  {f:'client',t:'gw',k:'m',l:'POST /api/v1/auth/register',d:'The user sends email, password and full name. The route is anonymous, so no token is needed.',c:['US-01.1','AC-1']},
  {f:'gw',t:'id',k:'m',l:'forward request',d:'The gateway removes any X-User-* headers from the request. Then it sends the request to the identity service.',c:['X-User-* stripped']},
  {t:'id',k:'s',l:'validate input',d:'FluentValidation checks the email format. The password must have 8 to 128 characters, at least 1 letter and 1 digit.',c:['BR-02']},
  {f:'id',t:'db',k:'m',l:'SELECT by normalized_email',d:'The service changes the email to upper case and looks for it. Emails that differ only in letter case count as the same email.',c:['BR-01']},
  {f:'db',t:'id',k:'r',l:'no match',d:'No user has this email. (If a user had it, the service would return 409 IDENTITY_EMAIL_TAKEN. See AC-2.)'},
  {t:'id',k:'s',l:'hash password',d:'ASP.NET PasswordHasher makes a hash. The service never stores the plain password.'},
  {f:'id',t:'db',k:'m',l:'INSERT user + role + outbox (one transaction)',d:'The service saves the user, gives the role Customer, and writes an outbox row for identity.user-registered.v1. All three writes use the same transaction.',c:['BR-08','Outbox']},
  {f:'id',t:'mail',k:'m',l:'SMTP: confirmation email',d:'The service puts the email in a queue. A background task sends it to Mailpit. The email has a link to /verify-email?userId=&token=.',c:['AC-1']},
  {f:'id',t:'gw',k:'r',l:'201 {userId}',d:'The service sends the new user ID back.'},
  {f:'gw',t:'client',k:'r',l:'201 {userId}',d:'The gateway sends the response to the browser. The user can log in now. An unconfirmed user can log in and shop (BR-04).'},
 ]},
 login: { title:'Login', steps:[
  {f:'client',t:'gw',k:'m',l:'POST /api/v1/auth/login',d:'The browser sends email and password.',c:['US-01.2']},
  {f:'gw',t:'id',k:'m',l:'forward request',d:'The gateway removes X-User-* headers and sends the request on.'},
  {f:'id',t:'redis',k:'m',l:'INCR auth:login-attempts:{ip}',d:'The service counts attempts from this IP address. The limit is 20 in 15 minutes. Above the limit the service returns 429.',c:['BR-03','TTL 15 min']},
  {f:'redis',t:'id',k:'r',l:'count = 1',d:'The count is below the limit. The request continues.'},
  {f:'id',t:'db',k:'m',l:'SELECT user by normalized_email',d:'The service loads the user, the roles and the permissions.'},
  {f:'db',t:'id',k:'r',l:'user row',d:'The row includes password_hash, failed_login_count and lockout_end.'},
  {t:'id',k:'s',l:'check lock + verify hash',d:'If lockout_end is in the future, the service returns 423. If not, PasswordHasher compares the hash. Status Locked or Deleted gives 401.',c:['BR-03','BR-09']},
  {f:'id',t:'db',k:'m',l:'reset failed count + INSERT refresh_token',d:'The password is correct. The service sets failed_login_count to 0. It creates a new refresh token and stores only its SHA-256 hash. The token starts a new family (family_id).',c:['BR-05','hash only']},
  {t:'id',k:'s',l:'sign access token (RS256)',d:'The service signs a JWT with the private key. The header has a kid. Claims: sub, jti, email, email_verified, name, role[], perm[]. It lives 15 minutes.',c:['expiresIn 900','kid']},
  {f:'id',t:'gw',k:'r',l:'200 {accessToken, refreshToken, expiresIn, user}',d:'The service returns both tokens and the user data.'},
  {f:'gw',t:'client',k:'r',l:'200 tokens',d:'The Next.js server stores the tokens in httpOnly cookies: at (access) and rt (refresh). JavaScript in the page cannot read them.',c:['cookie at','cookie rt']},
 ]},
 request: { title:'Call a protected API', steps:[
  {f:'client',t:'gw',k:'m',l:'GET /api/v1/users/me  + Bearer token',d:'The browser sends the access token in the Authorization header. The BFF reads it from the at cookie.',c:['Authorization: Bearer']},
  {f:'gw',t:'id',k:'m',l:'GET /.well-known/jwks.json (first time, then cached)',d:'The gateway needs the public key. It downloads the JWKS from the identity service. It keeps the keys in memory.',c:['JWKS','kid']},
  {f:'id',t:'gw',k:'r',l:'public keys',d:'The service returns the public key. The private key never leaves the identity service.'},
  {t:'gw',k:'s',l:'validate JWT',d:'The gateway checks the signature (by kid), the expiry time, the issuer and the audience stackshop-api. Failure gives 401.',c:['RS256','aud=stackshop-api']},
  {f:'gw',t:'redis',k:'m',l:'EXISTS auth:revoked-jti:{jti}',d:'The gateway checks if the token ID is on the blacklist. A logout puts it there.',c:['BR-09','AC-5']},
  {f:'redis',t:'gw',k:'r',l:'not found',d:'The token is not revoked. The request continues.'},
  {f:'gw',t:'id',k:'m',l:'forward + token',d:'The gateway removes any fake X-User-* headers. It sends the request with the token to the service.',c:['X-User-* stripped']},
  {t:'id',k:'s',l:'validate again + policy',d:'The service checks the token a second time. It also checks the permission policy, for example perm:users:read for admin routes. A missing permission gives 403.',c:['perm:<res>:<act>']},
  {f:'id',t:'db',k:'m',l:'SELECT user',d:'The service loads the current user data.'},
  {f:'db',t:'id',k:'r',l:'user row',d:''},
  {f:'id',t:'gw',k:'r',l:'200 {id,email,roles,permissions,…}',d:'The service returns the profile.'},
  {f:'gw',t:'client',k:'r',l:'200',d:'The browser shows the data. Without a token, or with a bad token, the gateway returns 401 at step 4 and the service does not see the request.'},
 ]},
 refresh: { title:'Refresh (rotation)', steps:[
  {f:'client',t:'gw',k:'m',l:'access token expires in < 60 s',d:'The Next.js middleware sees that the at cookie is near its end. It starts a refresh before the next page loads.',c:['AC-6','middleware.ts']},
  {f:'client',t:'gw',k:'m',l:'POST /api/v1/auth/refresh {refreshToken}',d:'The BFF sends the refresh token from the rt cookie.'},
  {f:'gw',t:'id',k:'m',l:'forward request',d:'The route is anonymous. The refresh token is the credential.'},
  {t:'id',k:'s',l:'hash the token',d:'The service computes the SHA-256 hash of the token. It does not store the plain token.'},
  {f:'id',t:'db',k:'m',l:'SELECT refresh_token by hash',d:'The service looks for the hash.'},
  {f:'db',t:'id',k:'r',l:'token row (active)',d:'The token is not revoked and not expired. The family is younger than 30 days.',c:['BR-05']},
  {f:'id',t:'db',k:'m',l:'revoke old + INSERT new (same family)',d:'The service sets revoked_at and replaced_by_id on the old token. It inserts a new token with a new 7-day expiry. A guard on revoked_at stops two parallel refreshes with the same token.',c:['rotation','sliding 7 d']},
  {t:'id',k:'s',l:'sign new access token',d:'The service signs a new JWT with a new jti.'},
  {f:'id',t:'gw',k:'r',l:'200 {accessToken, refreshToken, expiresIn}',d:'The service returns a new pair.'},
  {f:'gw',t:'client',k:'r',l:'200 new tokens',d:'The middleware writes both cookies again on the response. The old refresh token cannot be used again.'},
 ]},
 reuse: { title:'Token theft (reuse)', steps:[
  {f:'client',t:'gw',k:'m',l:'POST /auth/refresh {R1}',d:'R1 is an old refresh token. The real user already rotated it to R2. An attacker has a copy of R1.',c:['AC-4']},
  {f:'gw',t:'id',k:'m',l:'forward request',d:''},
  {f:'id',t:'db',k:'m',l:'SELECT refresh_token by hash(R1)',d:'The service finds the hash of R1.'},
  {f:'db',t:'id',k:'r',l:'row: revoked, replaced_by = R2',d:'R1 is already used. A valid client would never send it again.'},
  {t:'id',k:'s',l:'reuse detected',d:'The service decides that the token family is not safe. It writes a security warning to the log and adds 1 to stackshop_auth_refresh_total{outcome="reused"}.',c:['BR-06','metric: reused']},
  {f:'id',t:'db',k:'m',l:'revoke the whole family (R2 too)',d:'The service revokes all tokens in the family. The real user and the attacker both lose access.'},
  {f:'id',t:'gw',k:'e',l:'401 IDENTITY_REFRESH_REUSED',d:'The service returns an error with this code.'},
  {f:'gw',t:'client',k:'e',l:'401',d:'The BFF clears the cookies. The user must log in again. The access token of the real user ends within 15 minutes.'},
 ]},
 logout: { title:'Logout', steps:[
  {f:'client',t:'gw',k:'m',l:'POST /auth/logout {refreshToken, allDevices?} + Bearer',d:'The user logs out. The request has the access token and the refresh token.',c:['US-01.5']},
  {f:'gw',t:'id',k:'m',l:'forward request',d:'The gateway validates the token (see "Call a protected API") and sends the request on.'},
  {f:'id',t:'db',k:'m',l:'revoke refresh token (or whole family)',d:'The service sets revoked_at. If allDevices is true, it revokes the tokens of all sessions of this user.'},
  {f:'id',t:'redis',k:'m',l:'SET auth:revoked-jti:{jti}  EX = time left',d:'The service puts the token ID on the blacklist. The entry has a TTL equal to the time the token has left, so Redis removes it by itself.',c:['BR-09','AC-5']},
  {f:'id',t:'gw',k:'r',l:'204',d:''},
  {f:'gw',t:'client',k:'r',l:'204',d:'The BFF deletes the cookies.'},
  {f:'client',t:'gw',k:'m',l:'GET /users/me  + OLD access token',d:'Now someone sends the old access token. It is not yet expired.'},
  {f:'gw',t:'redis',k:'m',l:'EXISTS auth:revoked-jti:{jti}',d:'The gateway checks the blacklist.'},
  {f:'redis',t:'gw',k:'r',l:'found',d:'The token ID is on the list.'},
  {f:'gw',t:'client',k:'e',l:'401',d:'The gateway rejects the request. The identity service does not see it.',c:['AC-5']},
 ]},
 lockout: { title:'Lockout (5 wrong passwords)', steps:[
  {f:'client',t:'gw',k:'m',l:'login with wrong password (×1)',d:'The first wrong password.',c:['AC-3','BR-03']},
  {f:'gw',t:'id',k:'m',l:'forward request',d:''},
  {f:'id',t:'db',k:'m',l:'failed_login_count = 1',d:'The service adds 1 to the failed count of the user. It adds 1 to stackshop_auth_logins_total{outcome="invalid_credentials"}.'},
  {f:'id',t:'client',k:'e',l:'401 IDENTITY_INVALID_CREDENTIALS',d:'The error is the same for a wrong password and for an unknown email (BR-07). The reply does not show which one is wrong.'},
  {t:'id',k:'s',l:'attempts 2, 3, 4',d:'The same steps repeat. The failed count goes to 4.'},
  {f:'client',t:'id',k:'m',l:'login with wrong password (×5)',d:'The fifth wrong password.'},
  {f:'id',t:'db',k:'m',l:'failed_login_count = 5 → lockout_end = now + 15 min',d:'The service sets lockout_end. The lock is per account.',c:['lockout_end']},
  {f:'client',t:'id',k:'m',l:'login with the CORRECT password',d:'Now the user types the correct password.'},
  {t:'id',k:'s',l:'lockout_end is in the future',d:'The service does not check the password. The lock has priority.'},
  {f:'id',t:'client',k:'e',l:'423 IDENTITY_LOCKED_OUT',d:'The service returns 423 until 15 minutes pass. An admin can also lock a user (POST /admin/users/{id}/lock). A locked user gets 401 on refresh (BR-09).',c:['AC-3']},
 ]},
 reset: { title:'Forgot / reset password', steps:[
  {f:'client',t:'gw',k:'m',l:'POST /auth/forgot-password {email}',d:'The user forgot the password.',c:['US-01.4','AC-7']},
  {f:'gw',t:'id',k:'m',l:'forward request',d:''},
  {f:'id',t:'db',k:'m',l:'SELECT user by normalized_email',d:'The service looks for the email.'},
  {t:'id',k:'s',l:'if user exists: create reset token',d:'The service makes a random token. It stores only the hash in email_tokens (purpose Reset, 60 minutes or less). If the email is unknown, the service does nothing, and the response is the same.',c:['BR-07']},
  {f:'id',t:'db',k:'m',l:'INSERT email_token + outbox row',d:'The outbox row is identity.password-reset-requested.v1. It holds the token because the notification service (F10) must send it later. The service never writes this token to logs.'},
  {f:'id',t:'mail',k:'m',l:'SMTP: reset email',d:'The email has a link to /reset-password?token=&email=.'},
  {f:'id',t:'client',k:'r',l:'202 (always)',d:'The reply is 202 for known and unknown emails. An attacker cannot find out which emails exist.',c:['AC-7']},
  {f:'client',t:'id',k:'m',l:'POST /auth/reset-password {email, token, newPassword}',d:'The user opens the link and types a new password.'},
  {f:'id',t:'db',k:'m',l:'verify token hash, set new hash, revoke ALL refresh tokens',d:'The service checks the token (not used, not expired). It saves the new password hash and marks the token used. It revokes all refresh tokens of the user.',c:['all sessions end']},
  {f:'id',t:'client',k:'r',l:'204',d:'The user must log in again with the new password.'},
 ]},
};

const svg = document.getElementById('svg');
const NS = 'http://www.w3.org/2000/svg';
const W = 1000, TOP = 96, GAP = 58, LEFT = 90, RIGHT = 910;
const xOf = {};
ACTORS.forEach((a,i)=>{ xOf[a.id] = LEFT + i*(RIGHT-LEFT)/(ACTORS.length-1); });

let flowKey='register', cur=-1, playing=false, timer=null;

function el(n,attrs={},parent=svg,text){
  const e=document.createElementNS(NS,n);
  for(const k in attrs) e.setAttribute(k,attrs[k]);
  if(text!==undefined) e.textContent=text;
  parent.appendChild(e); return e;
}
function colorOf(k){ return k==='e' ? 'var(--err)' : k==='r' ? 'var(--muted)' : k==='s' ? 'var(--self)' : 'var(--ok)'; }

function build(){
  const flow = FLOWS[flowKey], steps = flow.steps;
  const H = TOP + steps.length*GAP + 40;
  svg.innerHTML=''; svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  const defs = el('defs');
  ['ok','muted','err','self'].forEach(c=>{
    const m = el('marker',{id:'ah-'+c,viewBox:'0 0 10 10',refX:'9',refY:'5',markerWidth:'7',markerHeight:'7',orient:'auto-start-reverse'},defs);
    el('path',{d:'M0 0 L10 5 L0 10 z',fill:`var(--${c})`},m);
  });
  ACTORS.forEach(a=>{
    const x=xOf[a.id];
    el('line',{x1:x,y1:TOP-20,x2:x,y2:H-20,class:'life'});
    el('rect',{x:x-62,y:12,width:124,height:50,rx:8,fill:'var(--panel2)',stroke:a.color,'stroke-width':2});
    el('text',{x:x,y:33,'text-anchor':'middle','font-size':12,'font-weight':600,fill:'var(--text)'},svg,a.name);
    el('text',{x:x,y:49,'text-anchor':'middle','font-size':10,fill:'var(--muted)'},svg,a.sub);
  });
  steps.forEach((s,i)=>{
    const y = TOP + i*GAP;
    const g = el('g',{class:'step',id:'st'+i});
    const color = colorOf(s.k);
    const cname = s.k==='e'?'err':s.k==='r'?'muted':s.k==='s'?'self':'ok';
    // number badge
    const bx = s.k==='s' ? xOf[s.t] : xOf[s.f];
    if(s.k==='s'){
      const w = Math.max(150, s.l.length*6.4+24), x=xOf[s.t]-w/2;
      el('rect',{x:Math.min(Math.max(x,6),W-w-6),y:y-16,width:w,height:30,rx:7,class:'noteBox'},g);
      const cx = Math.min(Math.max(x,6),W-w-6)+w/2;
      el('text',{x:cx,y:y+3,'text-anchor':'middle',class:'lbl'},g,s.l);
      s._dot = {x:xOf[s.t],y:y-16};
    } else {
      const x1=xOf[s.f], x2=xOf[s.t], dir = x2>x1?1:-1;
      const p = el('path',{d:`M${x1} ${y} L${x2-dir*2} ${y}`,class:'arrow',pathLength:1,stroke:color,'marker-end':`url(#ah-${cname})`},g);
      if(s.k==='r') p.setAttribute('style','stroke-dasharray:1');
      const mid=(x1+x2)/2, w=Math.abs(x2-x1);
      const t = el('text',{x:mid,y:y-8,'text-anchor':'middle',class:'lbl'},g,s.l);
      // shrink long labels
      if(s.l.length*6.1 > w-10) t.setAttribute('font-size','10.5');
      s._x1=x1; s._x2=x2; s._y=y;
    }
    el('circle',{cx:s.k==='s'?Math.min(Math.max(xOf[s.t]-Math.max(150,s.l.length*6.4+24)/2,6),W-Math.max(150,s.l.length*6.4+24)-6)-0:bx-0,cy:y,r:0},g);
    const num = el('g',{},g);
    const nx = s.k==='s' ? Math.min(Math.max(xOf[s.t]-Math.max(150,s.l.length*6.4+24)/2,6),W-Math.max(150,s.l.length*6.4+24)-6)-10 : (xOf[s.f]+(xOf[s.t]>xOf[s.f]?-12:12));
    el('circle',{cx:nx,cy:y,r:9,fill:color},num);
    el('text',{x:nx,y:y+3.5,'text-anchor':'middle',class:'badge'},num,String(i+1));
  });
  // dot
  svg.appendChild(el('circle',{id:'dot',r:7,fill:'var(--accent)',opacity:0,stroke:'#fff','stroke-width':2}));
  // list
  const list=document.getElementById('list'); list.innerHTML='';
  steps.forEach((s,i)=>{
    const li=document.createElement('li'); li.id='li'+i;
    li.innerHTML=`<b>${i+1}</b><span>${s.l}</span>`;
    li.onclick=()=>{ stop(); goTo(i,false); };
    list.appendChild(li);
  });
  cur=-1; render(false);
}

function speed(){ return parseFloat(document.getElementById('speed').value); }

function goTo(i, animate=true){
  const steps = FLOWS[flowKey].steps;
  cur = Math.max(-1, Math.min(steps.length-1, i));
  render(animate);
}

function render(animate){
  const steps = FLOWS[flowKey].steps;
  steps.forEach((s,i)=>{
    const g=document.getElementById('st'+i), li=document.getElementById('li'+i);
    g.classList.toggle('shown', i<=cur); g.classList.toggle('cur', i===cur);
    li.classList.toggle('done', i<cur); li.classList.toggle('cur', i===cur);
    const p=g.querySelector('.arrow');
    if(p){
      p.style.setProperty('--dur', (0.7*speed())+'s');
      if(i===cur && animate){ p.style.transition='none'; p.style.strokeDashoffset='1'; void p.getBoundingClientRect(); p.style.transition=''; p.style.strokeDashoffset='0'; }
      else if(i<=cur){ p.style.strokeDashoffset='0'; } else { p.style.strokeDashoffset='1'; }
    }
  });
  const dot=document.getElementById('dot');
  const s=steps[cur];
  document.getElementById('prev').disabled = cur<=-1;
  document.getElementById('next').disabled = cur>=steps.length-1;
  if(!s){
    document.getElementById('stepNo').textContent='Step';
    document.getElementById('stepTitle').textContent=FLOWS[flowKey].title;
    document.getElementById('stepDetail').textContent='Press Play or Next to start.';
    document.getElementById('chips').innerHTML=''; dot.setAttribute('opacity',0); return;
  }
  document.getElementById('stepNo').textContent=`Step ${cur+1} of ${steps.length}`;
  document.getElementById('stepTitle').textContent=s.l;
  document.getElementById('stepDetail').textContent=s.d||'';
  document.getElementById('chips').innerHTML=(s.c||[]).map(c=>`<span class="chip">${c}</span>`).join('');
  document.getElementById('li'+cur).scrollIntoView({block:'nearest'});
  document.getElementById('st'+cur).scrollIntoView({block:'nearest',behavior:'smooth'});
  if(s.k==='s' || !animate){ dot.setAttribute('opacity',0); return; }
  dot.setAttribute('opacity',1); dot.setAttribute('cy',s._y);
  dot.setAttribute('fill', s.k==='e'?'var(--err)':'var(--accent)');
  dot.animate([{transform:`translateX(${s._x1}px)`},{transform:`translateX(${s._x2}px)`}],
              {duration:700*speed(),easing:'ease-out',fill:'forwards'});
  dot.setAttribute('cx',0);
  setTimeout(()=>{ if(cur===steps.indexOf(s)) dot.setAttribute('opacity',0); }, 760*speed());
}

function tick(){
  const steps=FLOWS[flowKey].steps;
  if(cur>=steps.length-1){ stop(); return; }
  goTo(cur+1,true);
  timer=setTimeout(tick, (steps[cur].k==='s'?1300:1500)*speed()+ (steps[cur].d||'').length*8*speed());
}
function play(){
  if(cur>=FLOWS[flowKey].steps.length-1) goTo(-1,false);
  playing=true; document.getElementById('play').textContent='❚❚ Pause'; tick();
}
function stop(){ playing=false; clearTimeout(timer); document.getElementById('play').textContent='▶ Play'; }

document.getElementById('play').onclick=()=> playing?stop():play();
document.getElementById('next').onclick=()=>{ stop(); goTo(cur+1,true); };
document.getElementById('prev').onclick=()=>{ stop(); goTo(cur-1,false); };
document.getElementById('restart').onclick=()=>{ stop(); goTo(-1,false); play(); };

const tabs=document.getElementById('tabs');
Object.entries(FLOWS).forEach(([k,f])=>{
  const b=document.createElement('button'); b.className='tab'; b.textContent=f.title; b.dataset.k=k;
  b.onclick=()=>{ stop(); flowKey=k; document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.k===k)); build(); };
  tabs.appendChild(b);
});
tabs.firstChild.classList.add('active');
build();
</script>
</body>
</html>
